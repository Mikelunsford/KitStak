project_id = "zmnvwhqjahwidprnjxrq"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://www.kitstak.com"
additional_redirect_urls = ["https://app.kitstak.com", "http://localhost:5173"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
enabled = true
policy = "oneshot"

# notifications-worker is authenticated via the X-Worker-Secret header, not
# a Supabase JWT. Disable JWT verification so the scheduled drain can post
# from a cron runner without a session.
[functions.notifications-worker]
verify_jwt = false

# R-W13-SEC-01 JWT signature verification split.
#
# tenants-api and admin-console-api hold authenticated surfaces. The shared
# claim reader in _shared/tenant.ts (decodeJwtPayload) only base64-decodes the
# JWT body; it does NOT verify the signature. With verify_jwt = false a forged
# or unsigned token would pass that decode and reach the handler. Setting
# verify_jwt = true makes the Supabase gateway verify the signature BEFORE the
# bundle runs (rejecting forged tokens with 401 at the edge), so the
# decode-only reader is safe: the token is pre-verified by the time a handler
# sees it. _shared/mfa.ts gates on caller.userId, which is the gateway-verified
# `sub` claim, so MFA enforcement also benefits from the upgrade.
#
# The one pre-auth public route (/tenants/resolve-host) was moved into the
# tenants-public-api bundle below, which keeps verify_jwt = false so the SPA
# can resolve a custom hostname to an org before the user signs in. That
# route calls resolve_org_by_host, which itself enforces verified_at, so no
# unverified tenant leaks regardless of the missing JWT.

# tenants-public-api is the ONLY pre-auth public tenant route
# (/tenants/resolve-host). It runs with verify_jwt = false so the SPA can
# resolve a custom hostname back to an org before the user signs in. The
# service-role RPC enforces verified_at filtering. R-W13-SEC-01.
[functions.tenants-public-api]
verify_jwt = false

# tenants-api holds only authenticated routes (/branding, /tenants/me) now
# that the public resolver lives in tenants-public-api. verify_jwt = true so
# the gateway verifies the JWT signature before the handler runs. Closes
# F-Wave2-AGENT-A-06 (superseded) / R-W13-SEC-01.
[functions.tenants-api]
verify_jwt = true

# admin-console-api is a bundle-gated platform-admin surface
# (platform_admin.enabled). It has no public route, so verify_jwt = true is
# safe: the gateway verifies the JWT signature before any handler runs. An
# anonymous caller is rejected with 401 at the gateway. The handler's
# assertBundleEnabled() still throws 404 (not 403) when the flag is off for an
# authenticated caller, so the constitutional gate pattern is preserved past
# the gateway. R-W13-SEC-01 (supersedes the prior F-Wave5-API-03 setting; the
# bundle-existence concern is outweighed by signature verification, and the
# bundle is invisible to authenticated non-admin callers via the 404 gate).
[functions.admin-console-api]
verify_jwt = true

# stripe-webhook is called by Stripe, not by an authenticated Supabase
# session. Authentication is the HMAC signature in the Stripe-Signature
# header, verified against STRIPE_WEBHOOK_SECRET. Idempotency is the Stripe
# event_id, persisted in public.stripe_webhook_events. Stripe wiring block.
[functions.stripe-webhook]
verify_jwt = false

# audit-chain-verify is a scheduled integrity walker invoked by a GitHub Actions
# cron with Authorization: Bearer AUDIT_VERIFY_SECRET (a static shared secret),
# not a Supabase JWT. verify_jwt = false so the gateway lets the cron request
# reach the function's own secret check; with the default verify_jwt = true the
# gateway 401s the non-JWT bearer before the handler runs (the long-standing
# nightly red). Same posture as notifications-worker and stripe-webhook.
[functions.audit-chain-verify]
verify_jwt = false

# idempotency-gc is a scheduled cleanup invoked by a GitHub Actions cron with
# Authorization: Bearer GC_TRIGGER_SECRET, not a Supabase JWT. verify_jwt = false
# for the same reason as audit-chain-verify above, so the nightly GC sweep can
# reach the function's secret check instead of being 401'd at the gateway.
[functions.idempotency-gc]
verify_jwt = false
