name: nightly-rls-probe

# Cross-tenant RLS probe with ephemeral fixtures. The spec at
# apps/web/playwright/rls-probe.spec.ts creates two ephemeral users and
# orgs via the service role, probes cross-tenant access, asserts every
# cross-tenant read returns 200 plus empty array and every cross-tenant
# workflow POST returns 404 (never 403 where 404 is the constitutional
# answer), then tears down. Requires the staging environment to provide
# STAGING_SUPABASE_URL, STAGING_SUPABASE_ANON_KEY, and
# STAGING_SUPABASE_SERVICE_ROLE_KEY. Without those the probe skips with
# a clear message so the gate is green with zero false positives, not
# green from silently doing nothing.
#
# Per D-009 the staging environment is a Supabase preview branch.
# Secrets are sourced from `supabase branches get staging` and stored
# under the GitHub Actions 'staging' environment. Do NOT default to
# pointing at prod; the fixture creates and deletes rows.

on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC daily = 04:00 ET / 02:00 MT
  workflow_dispatch:

jobs:
  probe:
    name: Cross-tenant RLS probe against staging
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    # R-W14-OBS-01: issues:write so the failure step below can open a durable
    # incident issue. There is no external Slack/PagerDuty webhook secret, so
    # a GitHub issue is the self-contained alert channel.
    permissions:
      contents: read
      issues: write
    steps:
      # R-W14-OBS-02 / R-W14-RLS-PROBE-SILENTGREEN-01: a scheduled run with
      # missing secrets must go RED, not silently green. This probe backs the
      # v1 "30 consecutive green nights" gate, so a silent skip would break the
      # streak invisibly. On the nightly `schedule` event a missing secret is
      # an `::error::` plus `exit 1`. A manual `workflow_dispatch` re-run is
      # still allowed to no-op gracefully (a notice plus skip) so an operator
      # can fire the workflow on a branch that has no staging wire-up without
      # generating a false failure.
      - name: Verify staging secrets are configured
        id: secrets
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "${STAGING_SUPABASE_URL:-}" ] || [ -z "${STAGING_SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "::error::STAGING_SUPABASE_URL or STAGING_SUPABASE_SERVICE_ROLE_KEY not configured. The scheduled nightly RLS probe cannot run and must NOT pass silently green (it backs the 30-night v1 gate). Failing. Configure these secrets under the 'staging' environment (sourced from supabase branches get staging)."
              exit 1
            fi
            echo "::notice::STAGING_SUPABASE_URL or STAGING_SUPABASE_SERVICE_ROLE_KEY not configured. Manual run, skipping cleanly. Configure these secrets under the 'staging' environment to enable the probe."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.secrets.outputs.configured == 'true'

      - uses: pnpm/action-setup@v6
        if: steps.secrets.outputs.configured == 'true'

      - uses: actions/setup-node@v6
        if: steps.secrets.outputs.configured == 'true'
        with:
          # Node 22 because @supabase/realtime-js requires native WebSocket
          # (added in Node 22). Probe uses supabase-js admin client for
          # fixture bootstrap; the realtime client is initialized eagerly.
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.secrets.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: steps.secrets.outputs.configured == 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run RLS probe
        if: steps.secrets.outputs.configured == 'true'
        run: pnpm test:rls
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.STAGING_URL }}
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload report on failure
        if: failure() && steps.secrets.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-rls-report
          path: apps/web/playwright-report

      # R-W14-OBS-01: durable external alert channel. On any failure (a real
      # RLS regression, a missing-secret scheduled run, or an infra error) open
      # a tracked GitHub issue so the failure is not just a default email that
      # can be missed. Self-contained: no third-party webhook secret required.
      - name: Open incident issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `nightly-rls-probe failed (${new Date().toISOString().slice(0, 10)})`;
            const body = [
              'The nightly cross-tenant RLS probe failed.',
              '',
              `Run: ${runUrl}`,
              `Event: ${context.eventName}`,
              `Commit: ${context.sha}`,
              '',
              'A failure here is a release blocker per the constitution. It is one of:',
              '- a real cross-tenant RLS leak (a read returned rows or a workflow POST returned 403 where 404 is required),',
              '- a missing-secret scheduled run (the staging environment secrets are not configured), or',
              '- an infrastructure error during fixture bootstrap.',
              '',
              'Triage with docs/operations/probes.md. Download the playwright-rls-report artifact from the run for the full assertion trace. This issue also affects the 30-consecutive-green-night v1 gate.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['incident', 'probe-failure'],
            });
