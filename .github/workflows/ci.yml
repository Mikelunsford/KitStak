name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web lint
      # Typecheck the Supabase edge functions. `supabase functions deploy`
      # transpiles with esbuild and does NOT typecheck, so without this gate a
      # Deno-side type error only surfaces post-merge at deploy. Each bundle
      # entry point is checked; imported handlers and _shared are covered
      # transitively. node-modules-dir=none resolves the npm: import map from
      # Deno's own cache, ignoring the pnpm node_modules.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck edge functions (Deno)
        run: deno check --node-modules-dir=none --import-map=supabase/functions/deno.json $(find supabase/functions -maxdepth 2 -name index.ts)
      # F-Wave7-CANON-STEWARD-01 + F-Wave7-TRIGGER-AUDIT-01 grep guardrails.
      # Run before tests so a wave of stale TODO markers or a buggy trigger
      # migration fails fast (sub-1s each) without paying for the full test
      # matrix. Allowlists at scripts/canon-steward-allowlist.txt and
      # scripts/trigger-audit-allowlist.txt suppress known historical
      # entries (see those files for the require-a-follow-up rule).
      - run: node scripts/canon-steward-check.mjs
      - run: node scripts/trigger-audit-check.mjs
      # F-Wave10-REVIEW-REMEDIATION (WS-F / F3) migration-header-format guard.
      # Fails fast when a FUTURE migration (>= ENFORCE_FROM) is missing a
      # canonical header field. Already-applied files are grandfathered.
      - run: node scripts/migration-header-format-check.mjs
      - run: pnpm --filter web test
      - run: pnpm --filter web test:contract
      - run: pnpm --filter web build
      - run: pnpm --filter web bundle-budget
