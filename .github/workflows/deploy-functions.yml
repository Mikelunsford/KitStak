name: deploy-functions

# Deploy Supabase Edge Functions to prod. Triggers:
#   1. push to main on supabase/functions/** or config.toml. Fires
#      immediately for changes that do not touch migrations.
#   2. workflow_run after migrate.yml completes successfully on main.
#      Fires AFTER schema is up to date so coordinated migration plus
#      handler PRs deploy the function code only once the matching DDL
#      is live. Pins head_sha to the SHA migrate.yml just ran against
#      so the functions we deploy match the migrations that were just
#      applied. Closes the deploy-ordering race (R-W2-01 in TS1).
#   3. workflow_dispatch for manual redeploys.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  workflow_run:
    workflows: ['migrate']
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: supabase functions deploy
    runs-on: ubuntu-latest
    environment: production-functions
    timeout-minutes: 15
    # Only fire on the migrate.yml success conclusion when triggered via
    # workflow_run. push and workflow_dispatch always run.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # On workflow_run, default checkout is the workflow's default
          # branch SHA. Pin to the head_sha that migrate.yml just ran
          # against so the functions we deploy match the migrations that
          # were just applied.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: supabase/setup-cli@v1
        # Pin a version that recognises `db.major_version = 17`. CLI 1.180.0
        # predates PG17 GA support and rejects config.toml at startup. The
        # remote KitStak project runs Postgres 17.x (engine 17 GA channel),
        # confirmed via Supabase Management API on 2026-05-18.
        with:
          version: latest

      - name: Deploy each bundle
        run: |
          set -euo pipefail
          # Bundles registered to date.
          #   Wave 1: audit-chain-verify, idempotency-gc.
          #   Wave 2: 21 new bundles across Agents A through F.
          # Append new bundle names below as future waves ship them.
          # Order is informational; deploys run sequentially.
          BUNDLES=(
            # Wave 1 scheduled functions
            audit-chain-verify
            idempotency-gc
            # Wave 2 Agent A: identity, tenancy, branding, admin
            auth-api
            tenants-api
            settings-api
            admin-console-api
            # Wave 2 Agent B: CRM
            crm-api
            # Wave 2 Agent C: sales chassis, quoting, projects
            sales-config-api
            quotes-api
            projects-api
            # Wave 2 Agent D: invoicing, payments, finance
            invoicing-api
            finance-api
            # Wave 2 Agent E: vendors, inventory, 3PL ops
            vendors-api
            inventory-api
            ops-api
            # Wave 2 Agent F: cross-cutting, portals, workers
            collaboration-api
            search-api
            customer-portal-api
            dashboard-api
            exports-api
            imports-api
            notifications-worker
            pdf-worker
          )
          for bundle in "${BUNDLES[@]}"; do
            echo "==> Deploying $bundle"
            supabase functions deploy "$bundle" --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          done
          echo "All ${#BUNDLES[@]} functions deployed."
