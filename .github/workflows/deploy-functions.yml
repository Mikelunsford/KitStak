name: deploy-functions

# Deploy Supabase Edge Functions to prod and staging. Triggers:
#   1. push to main on supabase/functions/** or config.toml. Fires
#      immediately for changes that do not touch migrations.
#   2. workflow_run after migrate.yml completes successfully on main.
#      Fires AFTER schema is up to date so coordinated migration plus
#      handler PRs deploy the function code only once the matching DDL
#      is live. Pins head_sha to the SHA migrate.yml just ran against
#      so the functions we deploy match the migrations that were just
#      applied. Closes the deploy-ordering race (R-W2-01 in TS1).
#   3. workflow_dispatch for manual redeploys.
#
# Two jobs: deploy (prod) runs first, deploy_staging runs after prod
# succeeds. Both jobs source the SAME bundle list from the workflow-
# level BUNDLES env var below, so prod and staging cannot drift.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  workflow_run:
    workflows: ['migrate']
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Single source of truth for the function bundle list. Both deploy jobs
# (prod and staging) read this string and deploy the same set of bundles.
# Append new bundle names below as future waves ship them. Order is
# informational; deploys run sequentially per job.
env:
  BUNDLES: |
    audit-chain-verify
    idempotency-gc
    auth-api
    tenants-api
    settings-api
    admin-console-api
    crm-api
    sales-config-api
    quotes-api
    projects-api
    invoicing-api
    finance-api
    vendors-api
    inventory-api
    ops-api
    manufacturing-api
    collaboration-api
    search-api
    customer-portal-api
    dashboard-api
    exports-api
    imports-api
    notifications-worker
    pdf-worker
    billing-api
    stripe-webhook

jobs:
  deploy:
    name: supabase functions deploy (prod)
    runs-on: ubuntu-latest
    environment: production-functions
    timeout-minutes: 15
    # Only fire on the migrate.yml success conclusion when triggered via
    # workflow_run. push and workflow_dispatch always run.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # On workflow_run, default checkout is the workflow's default
          # branch SHA. Pin to the head_sha that migrate.yml just ran
          # against so the functions we deploy match the migrations that
          # were just applied.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: supabase/setup-cli@v1
        # Pin a version that recognises `db.major_version = 17`. CLI 1.180.0
        # predates PG17 GA support and rejects config.toml at startup. The
        # remote KitStak project runs Postgres 17.x (engine 17 GA channel),
        # confirmed via Supabase Management API on 2026-05-18.
        with:
          version: latest

      - name: Deploy each bundle (prod)
        run: |
          set -euo pipefail
          # BUNDLES is defined at the workflow level so prod and staging
          # deploy the same list.
          # Pass the workspace import map explicitly so bundles that import
          # bare `zod` (every _shared/types/<domain>.ts side-car) resolve to
          # npm:zod. Belt-and-suspenders alongside supabase/functions/deno.json.
          count=0
          while IFS= read -r bundle; do
            [ -z "$bundle" ] && continue
            echo "==> Deploying $bundle (prod)"
            supabase functions deploy "$bundle" \
              --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
              --import-map ./supabase/functions/deno.json
            count=$((count + 1))
          done <<< "$BUNDLES"
          echo "All $count functions deployed to prod."

  deploy_staging:
    name: supabase functions deploy (staging)
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    needs: deploy
    # Mirror the same workflow_run gate as the prod job. If prod is
    # skipped (failed migrate.yml conclusion), staging is skipped too.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy each bundle (staging)
        run: |
          set -euo pipefail
          # BUNDLES is defined at the workflow level so prod and staging
          # deploy the same list.
          count=0
          while IFS= read -r bundle; do
            [ -z "$bundle" ] && continue
            echo "==> Deploying $bundle (staging)"
            supabase functions deploy "$bundle" \
              --project-ref "${{ secrets.STAGING_SUPABASE_PROJECT_REF }}" \
              --import-map ./supabase/functions/deno.json
            count=$((count + 1))
          done <<< "$BUNDLES"
          echo "All $count functions deployed to staging."
