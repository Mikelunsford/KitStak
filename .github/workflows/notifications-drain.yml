name: notifications-drain

# Backstop drain trigger. The primary drain trigger now lives inside
# Supabase Postgres via pg_cron (migration 0056_pg_cron_notifications_drain.sql,
# every 1 minute, reads URL + secret from Supabase Vault). This GitHub
# Actions workflow runs at /30 cadence as a defense-in-depth backstop: if
# pg_cron ever errors out or Vault entries are accidentally cleared, the
# workflow still drains queued notifications eventually. Both triggers
# hit the same idempotent endpoint, so double-firing is harmless.
#
# History: this used to be the ONLY drain trigger at /5 cadence. GitHub
# scheduled workflows are documented as best-effort and routinely skip
# 30+ minute windows during peak load. On 2026-05-21 a customer sign-in
# magic link expired (1h Supabase token TTL) before the cron fired,
# motivating the pg_cron move. F-Wave9-NOTIFICATIONS-DRAIN-PG-CRON-01.
#
# Auth: WORKER_SECRET header. The worker bundle has verify_jwt = false
# (per supabase/config.toml) because the secret is the bearer of trust.
#
# Skip-guard: if SUPABASE_FUNCTION_URL or WORKER_SECRET is missing from
# repo Actions secrets, the job emits a notice and exits success, so a
# fresh fork or pre-secret state never red-X's.

on:
  schedule:
    # Every 30 minutes. Backstop only — primary trigger is pg_cron.
    # Cron uses UTC.
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - name: Verify secrets are configured
        id: secrets
        env:
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: |
          if [ -z "${SUPABASE_FUNCTION_URL:-}" ] || [ -z "${WORKER_SECRET:-}" ]; then
            echo "::notice::SUPABASE_FUNCTION_URL or WORKER_SECRET not configured. Skipping notifications drain. Set both secrets in the repo Actions settings to enable scheduled delivery."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: POST /notifications-worker/drain
        if: steps.secrets.outputs.configured == 'true'
        env:
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: |
          set -euo pipefail
          response=$(curl -fsS -X POST \
            -H "X-Worker-Secret: ${WORKER_SECRET}" \
            -H "Content-Type: application/json" \
            "${SUPABASE_FUNCTION_URL}/notifications-worker/drain")
          echo "$response"
          polled=$(echo "$response" | jq -r '.data.polled')
          delivered=$(echo "$response" | jq -r '.data.delivered')
          failed=$(echo "$response" | jq -r '.data.failed')
          echo "::notice::drain polled=${polled} delivered=${delivered} failed=${failed}"
