name: audit-chain-verify

on:
  schedule:
    # Daily at 09:00 UTC (03:00 America/Chicago, before the operator's morning).
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify secrets are configured
        id: secrets
        env:
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          AUDIT_VERIFY_SECRET: ${{ secrets.AUDIT_VERIFY_SECRET }}
        run: |
          if [ -z "${SUPABASE_FUNCTION_URL:-}" ] || [ -z "${AUDIT_VERIFY_SECRET:-}" ]; then
            echo "::notice::SUPABASE_FUNCTION_URL or AUDIT_VERIFY_SECRET not configured. Skipping audit chain verify. Set both secrets in the repo Actions settings to enable nightly verification."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Invoke audit-chain-verify
        if: steps.secrets.outputs.configured == 'true'
        env:
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          AUDIT_VERIFY_SECRET: ${{ secrets.AUDIT_VERIFY_SECRET }}
        run: |
          set -euo pipefail
          response=$(curl -fsS -X POST \
            -H "Authorization: Bearer ${AUDIT_VERIFY_SECRET}" \
            -H "Content-Type: application/json" \
            "${SUPABASE_FUNCTION_URL}/audit-chain-verify")
          echo "$response"
          broken=$(echo "$response" | jq -r '.data.broken_count')
          if [ "$broken" != "0" ]; then
            echo "::error::Audit chain broken in $broken row(s). Failing."
            exit 1
          fi
