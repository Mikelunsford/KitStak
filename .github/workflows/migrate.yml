name: migrate

# Forward-only migrations against prod. Fires on push to main when files
# under supabase/migrations change. deploy-functions.yml is workflow_run
# gated on this workflow's success and pins head_sha so the function code
# we deploy matches the schema we just applied.
#
# Manual approval gate on environment 'production-db'. Configure required
# reviewers in repo Settings -> Environments.
#
# GitHub Actions runners are IPv4-only; direct db hostname db.<ref>.supabase.co
# resolves to IPv6 in most regions. Route through the IPv4 pooler (session
# mode on :5432). `supabase link` probes the IPv6 host and aborts before
# --db-url-based steps can run, so we skip linking and pass --db-url on
# every step.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

jobs:
  push-migrations:
    name: supabase db push
    runs-on: ubuntu-latest
    environment: production-db
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        # Pin a version that recognises `db.major_version = 17`. CLI 1.180.0
        # predates PG17 GA support and rejects config.toml at startup. The
        # remote KitStak project runs Postgres 17.x (engine 17 GA channel),
        # confirmed via Supabase Management API on 2026-05-18.
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: List pending migrations
        run: |
          supabase migration list \
            --db-url "postgresql://postgres.${{ secrets.SUPABASE_PROJECT_REF }}:${{ secrets.SUPABASE_DB_PASSWORD }}@aws-0-us-west-1.pooler.supabase.com:5432/postgres"

      - name: Apply migrations (forward-only)
        run: |
          supabase db push \
            --db-url "postgresql://postgres.${{ secrets.SUPABASE_PROJECT_REF }}:${{ secrets.SUPABASE_DB_PASSWORD }}@aws-0-us-west-1.pooler.supabase.com:5432/postgres"

      - name: Verify final migration count
        run: |
          supabase migration list \
            --db-url "postgresql://postgres.${{ secrets.SUPABASE_PROJECT_REF }}:${{ secrets.SUPABASE_DB_PASSWORD }}@aws-0-us-west-1.pooler.supabase.com:5432/postgres"
