name: migrate

# Forward-only migrations against prod, then mirrored to staging. Fires
# on push to main when files under supabase/migrations change.
# deploy-functions.yml is workflow_run gated on this workflow's success
# (prod job) and pins head_sha so the function code we deploy matches
# the schema we just applied.
#
# Prod (push-migrations job): manual approval gate on environment
# 'production-db'. Configure required reviewers in repo Settings ->
# Environments.
#
# Staging (push-migrations-staging job): runs after prod succeeds, no
# approval gate, continue-on-error so a staging failure does not mark
# the workflow red. Uses SUPABASE_STAGING_PROJECT_REF and
# SUPABASE_STAGING_DB_PASSWORD repo secrets. Both pooler endpoints sit
# in aws-1-us-west-1 (Supabase preview branches inherit parent region).
#
# GitHub Actions runners are IPv4-only; direct db hostname db.<ref>.supabase.co
# resolves to IPv6 in most regions. Route through the IPv4 pooler (session
# mode on :5432). `supabase link` probes the IPv6 host and aborts before
# --db-url-based steps can run, so we skip linking and pass --db-url on
# every step.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

jobs:
  push-migrations:
    name: supabase db push
    runs-on: ubuntu-latest
    environment: production-db
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        # Pin a version that recognises `db.major_version = 17`. CLI 1.180.0
        # predates PG17 GA support and rejects config.toml at startup. The
        # remote KitStak project runs Postgres 17.x (engine 17 GA channel),
        # confirmed via Supabase Management API on 2026-05-18.
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: List pending migrations
        run: |
          supabase migration list \
            --db-url "postgresql://postgres.${{ secrets.SUPABASE_PROJECT_REF }}:${{ secrets.SUPABASE_DB_PASSWORD }}@aws-1-us-west-1.pooler.supabase.com:5432/postgres"

      - name: Apply migrations (forward-only)
        run: |
          supabase db push \
            --db-url "postgresql://postgres.${{ secrets.SUPABASE_PROJECT_REF }}:${{ secrets.SUPABASE_DB_PASSWORD }}@aws-1-us-west-1.pooler.supabase.com:5432/postgres"

      - name: Verify final migration count
        run: |
          supabase migration list \
            --db-url "postgresql://postgres.${{ secrets.SUPABASE_PROJECT_REF }}:${{ secrets.SUPABASE_DB_PASSWORD }}@aws-1-us-west-1.pooler.supabase.com:5432/postgres"

  push-migrations-staging:
    name: supabase db push (staging)
    runs-on: ubuntu-latest
    needs: push-migrations
    # Staging is the non-default Supabase branch (project_ref
    # dnkgaufydcnedgkuoyml), with_data:false, no production data to
    # protect. No environment gate so reconciliation is automatic.
    # continue-on-error keeps a staging failure from marking the overall
    # workflow red, since prod has already shipped by this point and
    # forward-only migrations cannot be rolled back regardless.
    continue-on-error: true
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: List pending migrations
        run: |
          supabase migration list \
            --db-url "postgresql://postgres.${{ secrets.SUPABASE_STAGING_PROJECT_REF }}:${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}@aws-1-us-west-1.pooler.supabase.com:5432/postgres"

      - name: Apply migrations (forward-only)
        run: |
          supabase db push \
            --db-url "postgresql://postgres.${{ secrets.SUPABASE_STAGING_PROJECT_REF }}:${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}@aws-1-us-west-1.pooler.supabase.com:5432/postgres"

      - name: Verify final migration count
        run: |
          supabase migration list \
            --db-url "postgresql://postgres.${{ secrets.SUPABASE_STAGING_PROJECT_REF }}:${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}@aws-1-us-west-1.pooler.supabase.com:5432/postgres"
