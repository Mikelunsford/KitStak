name: deploy-prod

on:
  push:
    branches: [main]

# Serialize production deploys so back-to-back merges to main don't race.
# Without this, two PRs merged within seconds (e.g. SMOKE-01 #139 + SMOKE-02
# #140 on 2026-05-23) trigger two parallel deploy-prod runs whose Vercel-side
# alias promotions race; whichever finishes last wins the production alias,
# which can leave the OLDER commit serving on www.kitstak.com even though its
# CI finished FIRST. `cancel-in-progress: false` keeps any in-flight prod
# deploy alive (we never want to abort a promotion mid-flight) and queues the
# next one behind it.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  vercel-prod:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      # `vercel pull` deliberately does NOT pull env vars marked "Sensitive"
      # in the Vercel project to the local .env.local that `vercel build`
      # reads (this is a documented Vercel security behaviour: Sensitive vars
      # are only injected when the build runs on Vercel's own infrastructure,
      # not on a third-party CI runner). Since this workflow runs `vercel
      # build` on GitHub Actions, any Sensitive VITE_* var would otherwise
      # land in the SPA bundle as `undefined` and Rollup would tree-shake the
      # dependent code paths. The fix: mirror the lighthouse.yml pattern and
      # inject the Sensitive VITE_* values from GitHub repository secrets at
      # the `env:` block of the build step. The build process reads them from
      # process.env and Vite's `define` step substitutes them into the bundle
      # at compile time. Background: F-Wave8-POSTHOG-PROJECT-SETUP-01 close
      # silently regressed when VITE_POSTHOG_KEY was later flagged Sensitive
      # in Vercel; F-Wave5-CO-01 (SPA portion) activation failed for the
      # same reason on VITE_SENTRY_DSN. Both env vars are designed to be
      # frontend-public (PostHog Project Token is rate-limited per project;
      # Sentry DSN is rate-limited per project) so storing them as GitHub
      # repo secrets carries no incremental risk vs the SPA bundle itself.
      - run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          # F-Wave9-SENTRY-SOURCEMAPS-01: build-time secrets for
          # @sentry/vite-plugin. No VITE_ prefix so the values stay out
          # of the SPA bundle (enforced by the contract test at
          # apps/web/test/regression/sentry-auth-leak.test.ts). When
          # SENTRY_AUTH_TOKEN is absent the plugin no-ops and the build
          # still ships; maps just stay un-uploaded.
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
